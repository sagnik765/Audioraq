name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.prod.txt
            backend/requirements.dev.txt

      # The runtime set is installed first and on its own, so the test run
      # exercises the application against exactly the packages the Docker
      # image ships. A module imported by the app but missing from
      # requirements.prod.txt fails here instead of at container start.
      - name: Install runtime dependencies
        run: python -m pip install -r backend/requirements.prod.txt
      - name: Install test and lint tooling
        run: python -m pip install -r backend/requirements.dev.txt

      - name: Byte-compile
        run: python -m py_compile backend/server.py backend/voice_quality.py scripts/audioraq_voice_benchmark.py

      - name: Lint
        run: python -m flake8 backend/ tests/

      - name: Tests
        env:
          MONGO_URL: mongodb://localhost:27017
        run: python -m pytest -q tests
