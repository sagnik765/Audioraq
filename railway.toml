# Keep this file in the deploy watch set so backend changes can force a rebuild when needed.
[build]
builder = "DOCKERFILE"
watchPatterns = ["backend/**", "frontend/**", "Dockerfile", "railway.toml"]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
