services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command:
      - --auth
      - --bind_ip_all
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db

  app:
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile.runtime
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      MONGO_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      EMERGENT_LLM_KEY: ${EMERGENT_LLM_KEY}
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
      CORS_ORIGINS: https://${APEX_DOMAIN},https://${WWW_DOMAIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      APPLE_REDIRECT_URI: ${APPLE_REDIRECT_URI:-}
      AI_AUDIO_TTS_PROVIDER: ${AI_AUDIO_TTS_PROVIDER:-auto}
      AI_AUDIO_TTS_LOCAL_FALLBACK: ${AI_AUDIO_TTS_LOCAL_FALLBACK:-true}
      AI_AUDIO_TTS_MAX_CHARS: ${AI_AUDIO_TTS_MAX_CHARS:-4800}
      AI_AUDIO_TTS_MAX_CHARS_PER_TURN: ${AI_AUDIO_TTS_MAX_CHARS_PER_TURN:-1400}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      OPENAI_TTS_VOICE_HOST: ${OPENAI_TTS_VOICE_HOST:-marin}
      OPENAI_TTS_VOICE_GUEST: ${OPENAI_TTS_VOICE_GUEST:-cedar}
      OPENAI_TTS_VOICE_NARRATOR: ${OPENAI_TTS_VOICE_NARRATOR:-coral}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_v3}
      ELEVENLABS_OUTPUT_FORMAT: ${ELEVENLABS_OUTPUT_FORMAT:-mp3_44100_128}
      ELEVENLABS_VOICE_ID_HOST: ${ELEVENLABS_VOICE_ID_HOST:-JBFqnCBsd6RMkjVDRZzb}
      ELEVENLABS_VOICE_ID_GUEST: ${ELEVENLABS_VOICE_ID_GUEST:-Aw4FAjKCGjjNkVhN1Xmq}
      ELEVENLABS_VOICE_ID_NARRATOR: ${ELEVENLABS_VOICE_ID_NARRATOR:-}
      VOSK_MODEL_DIR: ${VOSK_MODEL_DIR:-/tmp/vosk-model-small-en-us-0.15}
      VOSK_MODEL_URL: ${VOSK_MODEL_URL:-https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip}
      MAX_MEDIA_TRANSCRIPT_SECONDS: ${MAX_MEDIA_TRANSCRIPT_SECONDS:-1800}

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      APEX_DOMAIN: ${APEX_DOMAIN}
      WWW_DOMAIN: ${WWW_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
