services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command:
      - --auth
      - --bind_ip_all
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db

  app:
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile.runtime
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      MONGO_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      EMERGENT_LLM_KEY: ${EMERGENT_LLM_KEY}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-emergent}
      LOCAL_STORAGE_DIR: ${LOCAL_STORAGE_DIR:-/app/data/media}
      AI_STUDIO_MODE: ${AI_STUDIO_MODE:-sync}
      AI_TEXT_PROVIDER: ${AI_TEXT_PROVIDER:-auto}
      AI_TEXT_ALLOW_REMOTE: ${AI_TEXT_ALLOW_REMOTE:-true}
      AI_TEXT_LOCAL_ENABLED: ${AI_TEXT_LOCAL_ENABLED:-false}
      AI_TEXT_LOCAL_BASE_URL: ${AI_TEXT_LOCAL_BASE_URL:-http://host.docker.internal:11434}
      AI_TEXT_LOCAL_MODEL: ${AI_TEXT_LOCAL_MODEL:-llama3.2:3b}
      AI_TEXT_TIMEOUT_SECONDS: ${AI_TEXT_TIMEOUT_SECONDS:-240}
      AI_TEXT_CONTEXT_TOKENS: ${AI_TEXT_CONTEXT_TOKENS:-8192}
      AI_TEXT_TEMPERATURE: ${AI_TEXT_TEMPERATURE:-0.7}
      AI_TEXT_REMOTE_PROVIDER: ${AI_TEXT_REMOTE_PROVIDER:-openai}
      AI_TEXT_REMOTE_MODEL: ${AI_TEXT_REMOTE_MODEL:-gpt-5.2}
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
      CORS_ORIGINS: https://${APEX_DOMAIN},https://${WWW_DOMAIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      APPLE_REDIRECT_URI: ${APPLE_REDIRECT_URI:-}
      AI_AUDIO_TTS_PROVIDER: ${AI_AUDIO_TTS_PROVIDER:-local}
      AI_AUDIO_LOCAL_TTS_URL: ${AI_AUDIO_LOCAL_TTS_URL:-}
      AI_AUDIO_LOCAL_TTS_PROFILE: ${AI_AUDIO_LOCAL_TTS_PROFILE:-podcast-dialogue}
      AI_AUDIO_LOCAL_TTS_FORMAT: ${AI_AUDIO_LOCAL_TTS_FORMAT:-wav}
      AI_AUDIO_LOCAL_TTS_TIMEOUT_SECONDS: ${AI_AUDIO_LOCAL_TTS_TIMEOUT_SECONDS:-900}
      AI_AUDIO_TARGET_LUFS: ${AI_AUDIO_TARGET_LUFS:--16}
      AI_AUDIO_REQUIRE_NEURAL_WORKER: ${AI_AUDIO_REQUIRE_NEURAL_WORKER:-false}
      AI_AUDIO_ENFORCE_LISTENABILITY_GATE: ${AI_AUDIO_ENFORCE_LISTENABILITY_GATE:-true}
      AI_AUDIO_MIN_LISTENABILITY_SCORE: ${AI_AUDIO_MIN_LISTENABILITY_SCORE:-68}
      AI_AUDIO_REQUIRE_VOICE_METRICS: ${AI_AUDIO_REQUIRE_VOICE_METRICS:-false}
      AI_AUDIO_TTS_LOCAL_FALLBACK: ${AI_AUDIO_TTS_LOCAL_FALLBACK:-true}
      AI_AUDIO_TTS_APPLE_SAY_ENABLED: ${AI_AUDIO_TTS_APPLE_SAY_ENABLED:-true}
      AI_AUDIO_TTS_LOCAL_FILTER: ${AI_AUDIO_TTS_LOCAL_FILTER:-highpass=f=80,lowpass=f=12000,loudnorm=I=-16:TP=-1.5:LRA=11}
      AI_AUDIO_TTS_LOCAL_MULTIVOICE: ${AI_AUDIO_TTS_LOCAL_MULTIVOICE:-true}
      AI_AUDIO_TTS_LOCAL_POSTPROCESS: ${AI_AUDIO_TTS_LOCAL_POSTPROCESS:-true}
      AI_AUDIO_TTS_LOCAL_VOICE_PROFILE: ${AI_AUDIO_TTS_LOCAL_VOICE_PROFILE:-proof_studio}
      AI_AUDIO_TTS_LOCAL_OUTPUT_FORMAT: ${AI_AUDIO_TTS_LOCAL_OUTPUT_FORMAT:-wav}
      AI_AUDIO_TTS_LOCAL_MP3_BITRATE: ${AI_AUDIO_TTS_LOCAL_MP3_BITRATE:-160k}
      AI_AUDIO_TTS_LOCAL_VOICE_HOST: ${AI_AUDIO_TTS_LOCAL_VOICE_HOST:-en-us+m3}
      AI_AUDIO_TTS_LOCAL_VOICE_GUEST: ${AI_AUDIO_TTS_LOCAL_VOICE_GUEST:-en-us+m3}
      AI_AUDIO_TTS_LOCAL_VOICE_NARRATOR: ${AI_AUDIO_TTS_LOCAL_VOICE_NARRATOR:-en-us+m3}
      AI_AUDIO_TTS_LOCAL_SPEED_HOST: ${AI_AUDIO_TTS_LOCAL_SPEED_HOST:-158}
      AI_AUDIO_TTS_LOCAL_SPEED_GUEST: ${AI_AUDIO_TTS_LOCAL_SPEED_GUEST:-158}
      AI_AUDIO_TTS_LOCAL_SPEED_NARRATOR: ${AI_AUDIO_TTS_LOCAL_SPEED_NARRATOR:-158}
      AI_AUDIO_TTS_LOCAL_PITCH_HOST: ${AI_AUDIO_TTS_LOCAL_PITCH_HOST:-48}
      AI_AUDIO_TTS_LOCAL_PITCH_GUEST: ${AI_AUDIO_TTS_LOCAL_PITCH_GUEST:-48}
      AI_AUDIO_TTS_LOCAL_PITCH_NARRATOR: ${AI_AUDIO_TTS_LOCAL_PITCH_NARRATOR:-48}
      AI_AUDIO_MAX_WORDS: ${AI_AUDIO_MAX_WORDS:-1200}
      AI_AUDIO_TTS_MAX_CHARS: ${AI_AUDIO_TTS_MAX_CHARS:-4500}
      AI_AUDIO_TTS_MAX_CHARS_PER_TURN: ${AI_AUDIO_TTS_MAX_CHARS_PER_TURN:-1400}
      AI_AUDIO_MIN_FINAL_TURN_WORDS: ${AI_AUDIO_MIN_FINAL_TURN_WORDS:-18}
      AI_AUDIO_RESERVED_END_TURNS: ${AI_AUDIO_RESERVED_END_TURNS:-2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      OPENAI_TTS_VOICE_HOST: ${OPENAI_TTS_VOICE_HOST:-marin}
      OPENAI_TTS_VOICE_GUEST: ${OPENAI_TTS_VOICE_GUEST:-cedar}
      OPENAI_TTS_VOICE_NARRATOR: ${OPENAI_TTS_VOICE_NARRATOR:-coral}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_v3}
      ELEVENLABS_OUTPUT_FORMAT: ${ELEVENLABS_OUTPUT_FORMAT:-mp3_44100_128}
      ELEVENLABS_MAX_REQUEST_CHARS: ${ELEVENLABS_MAX_REQUEST_CHARS:-4500}
      ELEVENLABS_VOICE_ID_HOST: ${ELEVENLABS_VOICE_ID_HOST:-JBFqnCBsd6RMkjVDRZzb}
      ELEVENLABS_VOICE_ID_GUEST: ${ELEVENLABS_VOICE_ID_GUEST:-}
      ELEVENLABS_VOICE_ID_NARRATOR: ${ELEVENLABS_VOICE_ID_NARRATOR:-}
      VOSK_MODEL_DIR: ${VOSK_MODEL_DIR:-/tmp/vosk-model-small-en-us-0.15}
      VOSK_MODEL_URL: ${VOSK_MODEL_URL:-https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip}
      AI_AUDIO_CLARITY_MAX_SECONDS: ${AI_AUDIO_CLARITY_MAX_SECONDS:-180}
      EPISODE_SAFETY_FAST_PATH: ${EPISODE_SAFETY_FAST_PATH:-true}
      AUDIORAQ_ORIGINALS_AGENT2_MIN_SCORE: ${AUDIORAQ_ORIGINALS_AGENT2_MIN_SCORE:-90}
      MAX_MEDIA_TRANSCRIPT_SECONDS: ${MAX_MEDIA_TRANSCRIPT_SECONDS:-180}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media_data:/app/data/media

  ai-studio-worker:
    profiles:
      - ai-studio
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile.ai-studio-worker
      args:
        INSTALL_KOKORO: ${AI_STUDIO_INSTALL_KOKORO:-false}
        INSTALL_CHATTERBOX: ${AI_STUDIO_INSTALL_CHATTERBOX:-false}
        PYTORCH_CPU_VERSION: ${AI_STUDIO_PYTORCH_CPU_VERSION:-2.8.0}
        TORCHAUDIO_CPU_VERSION: ${AI_STUDIO_TORCHAUDIO_CPU_VERSION:-2.8.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8015:8015"
    volumes:
      - tts_cache:/root/.cache
    environment:
      AUDIORAQ_TTS_ENGINE: ${AUDIORAQ_TTS_ENGINE:-auto}
      AUDIORAQ_TTS_ALLOW_ESPEAK_FALLBACK: ${AUDIORAQ_TTS_ALLOW_ESPEAK_FALLBACK:-true}
      AUDIORAQ_TTS_KOKORO_LANG: ${AUDIORAQ_TTS_KOKORO_LANG:-a}
      AUDIORAQ_TTS_KOKORO_SPEED: ${AUDIORAQ_TTS_KOKORO_SPEED:-0.94}
      AUDIORAQ_TTS_KOKORO_VOICE_HOST: ${AUDIORAQ_TTS_KOKORO_VOICE_HOST:-am_michael}
      AUDIORAQ_TTS_KOKORO_VOICE_GUEST: ${AUDIORAQ_TTS_KOKORO_VOICE_GUEST:-af_bella}
      AUDIORAQ_TTS_KOKORO_VOICE_NARRATOR: ${AUDIORAQ_TTS_KOKORO_VOICE_NARRATOR:-af_sarah}
      AUDIORAQ_TTS_CHATTERBOX_DEVICE: ${AUDIORAQ_TTS_CHATTERBOX_DEVICE:-cpu}
      AUDIORAQ_TTS_CHATTERBOX_VARIANT: ${AUDIORAQ_TTS_CHATTERBOX_VARIANT:-standard}
      AUDIORAQ_TTS_MASTERING_FILTER: ${AUDIORAQ_TTS_MASTERING_FILTER:-}
      AUDIORAQ_TTS_MAX_CHARS_PER_TURN: ${AUDIORAQ_TTS_MAX_CHARS_PER_TURN:-900}

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      APEX_DOMAIN: ${APEX_DOMAIN}
      WWW_DOMAIN: ${WWW_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
  media_data:
  tts_cache:
